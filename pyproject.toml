[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branchmind"
version = "0.1.0"
description = "DFS-based AI answer filtering and synthesis"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "python-dotenv",
]

[project.scripts]
branchmind = "branchmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
